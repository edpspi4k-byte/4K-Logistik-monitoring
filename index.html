<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistem Pencatatan Logistik</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-start sm:items-center justify-center p-3">

<!-- LOGIN -->
<div id="loginSection" class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-md mt-10 sm:mt-0 space-y-3">
  <h2 class="text-2xl font-bold text-gray-800 text-center">Login Petugas</h2>
  <p id="srv" class="text-xs text-center text-gray-400">Memeriksa server...</p>
  <input id="username" autocapitalize="none" placeholder="Username" class="w-full p-3 border rounded-lg">
  <input id="password" type="password" placeholder="Password" class="w-full p-3 border rounded-lg">
  <p id="loginMsg" class="text-sm text-red-600"></p>
  <button id="loginBtn" onclick="handleLogin()" class="w-full bg-blue-600 text-white p-3 rounded-lg font-semibold disabled:opacity-60">Masuk</button>
  <button onclick="showRegister(true)" class="w-full text-sm text-blue-600 underline">Belum punya akun? Ajukan pendaftaran</button>
</div>

<!-- PENDAFTARAN -->
<div id="registerSection" class="hidden bg-white p-6 rounded-2xl shadow-lg w-full max-w-md mt-10 sm:mt-0 space-y-3">
  <h2 class="text-xl font-bold text-gray-800 text-center">Permintaan Pendaftaran User</h2>
  <input id="regNik" inputmode="numeric" maxlength="16" placeholder="NIK (16 digit)" class="w-full p-3 border rounded-lg">
  <input id="regNama" placeholder="Nama lengkap" class="w-full p-3 border rounded-lg">
  <textarea id="regKet" rows="3" placeholder="Keterangan (bagian/keperluan)" class="w-full p-3 border rounded-lg"></textarea>
  <p id="regMsg" class="text-sm"></p>
  <button id="regBtn" onclick="kirimPermintaan()" class="w-full bg-blue-600 text-white p-3 rounded-lg font-semibold disabled:opacity-60">Kirim Permintaan</button>
  <button onclick="showRegister(false)" class="w-full text-sm text-gray-600 underline">Kembali ke login</button>
</div>

<!-- APLIKASI -->
<div id="appSection" class="hidden bg-white p-5 rounded-2xl shadow-lg w-full max-w-lg">
  <div class="flex justify-between items-center mb-4 border-b pb-2">
    <h2 class="text-lg font-bold text-gray-800">Input Logistik</h2>
    <div class="flex items-center gap-2 flex-wrap justify-end">
      <span id="counter" class="text-xs bg-green-100 text-green-800 px-2 py-1 rounded font-semibold">0 scan</span>
      <span id="loggedUser" class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded"></span>
      <button id="adminBtn" onclick="toggleAdmin()" class="hidden text-xs bg-purple-600 text-white px-2 py-1 rounded">Kelola Data</button>
      <button onclick="location.reload()" class="text-xs text-gray-500 underline">Keluar</button>
    </div>
  </div>

  <p id="masterInfo" class="text-xs text-gray-500 -mt-2 mb-3"></p>

  <div id="adminPanel" class="hidden space-y-4">
    <div class="flex gap-2">
      <button id="tb_user" onclick="showTab('user')">User</button>
      <button id="tb_kurir" onclick="showTab('kurir')">Kurir</button>
      <button id="tb_kend" onclick="showTab('kend')">Kendaraan</button>
    </div>
    <div id="tab_user" class="space-y-3">
      <input id="aUser" autocapitalize="none" placeholder="Username" class="w-full p-3 border rounded-lg">
      <input id="aPass" placeholder="Password" class="w-full p-3 border rounded-lg">
      <input id="aNama" placeholder="Nama (opsional)" class="w-full p-3 border rounded-lg">
      <button onclick="tambahUserBaru()" class="w-full bg-purple-600 text-white p-3 rounded-lg font-semibold">Tambah User</button>
      <div id="userList"></div>
    </div>
    <div id="tab_kurir" class="hidden space-y-3">
      <input id="kNama" placeholder="Nama kurir" class="w-full p-3 border rounded-lg">
      <button onclick="tambahKurir()" class="w-full bg-purple-600 text-white p-3 rounded-lg font-semibold">Tambah Kurir</button>
      <div id="kurirList"></div>
    </div>
    <div id="tab_kend" class="hidden space-y-3">
      <input id="vPlat" placeholder="Plat (contoh: B 1234 XYZ)" autocapitalize="characters" class="w-full p-3 border rounded-lg uppercase">
      <input id="vJenis" list="jenisList" placeholder="Jenis kendaraan (Motor, Pickup, ...)" class="w-full p-3 border rounded-lg">
      <datalist id="jenisList"></datalist>
      <button onclick="tambahKendaraan()" class="w-full bg-purple-600 text-white p-3 rounded-lg font-semibold">Tambah Kendaraan</button>
      <div id="kendList"></div>
    </div>
  </div>

  <form id="logForm" onsubmit="handleSubmit(event)" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700">Kode Barcode</label>
      <div class="flex gap-2 mt-1">
        <input id="barcode" required autocomplete="off" placeholder="Scan atau ketik..." class="w-full p-3 border rounded-lg font-mono">
        <button type="button" onclick="openScanner()" class="bg-gray-800 text-white px-4 rounded-lg text-sm whitespace-nowrap">📷 Scan</button>
      </div>
      <div class="flex items-center justify-between mt-2 text-xs text-gray-600">
        <label class="flex items-center gap-1"><input type="checkbox" id="autoSave"> Simpan otomatis setelah scan</label>
        <label class="underline cursor-pointer">Scan dari foto
          <input type="file" id="fileScan" accept="image/*" capture="environment" class="hidden">
        </label>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="block text-sm font-medium text-gray-700">Shift</label>
        <select id="shift" required class="w-full mt-1 p-3 border rounded-lg bg-white">
          <option value="">Pilih</option><option>Pagi</option><option>Siang</option><option>Malam</option>
        </select></div>
      <div><label class="block text-sm font-medium text-gray-700">Kurir</label>
        <select id="kurir" required class="w-full mt-1 p-3 border rounded-lg bg-white"><option value="">Pilih</option></select></div>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="block text-sm font-medium text-gray-700">Plat Kendaraan</label>
        <input id="plat" required autocomplete="off" list="platList" placeholder="B 1234 XYZ" autocapitalize="characters" class="w-full mt-1 p-3 border rounded-lg uppercase"></div>
      <div><label class="block text-sm font-medium text-gray-700">Jenis Kendaraan</label>
        <select id="jenisKendaraan" required class="w-full mt-1 p-3 border rounded-lg bg-white"><option value="">Pilih</option></select></div>
    </div>
    <datalist id="platList"></datalist>
    <p id="platStatus" class="text-xs"></p>
    <div class="text-xs bg-yellow-50 border border-yellow-200 text-yellow-800 rounded-lg p-2">ℹ Pastikan kurir, plat, dan jenis kendaraan sudah sesuai sebelum menyimpan. Pilih jenis kendaraan untuk mengisi plat otomatis, atau ketik plat untuk memilih jenis otomatis.</div>
    <button type="submit" id="submitBtn" class="w-full bg-green-600 text-white p-3 rounded-lg font-semibold disabled:opacity-60">Simpan Data</button>
  </form>
</div>

<!-- SCANNER -->
<div id="reader" class="hidden"></div>
<div id="scanOverlay" class="hidden fixed inset-0 bg-black z-50 flex flex-col">
  <div class="flex justify-between items-center p-3 text-white">
    <span class="font-semibold">Scan Barcode / QR</span>
    <div class="flex gap-2">
      <button id="torchBtn" onclick="toggleTorch()" class="hidden bg-white/20 px-3 py-1 rounded">🔦</button>
      <button onclick="closeScanner()" class="bg-red-600 px-3 py-1 rounded">Tutup</button>
    </div>
  </div>
  <div class="flex-1 flex items-center justify-center overflow-hidden">
    <div class="relative w-full">
      <video id="cam" playsinline muted class="w-full block"></video>
      <div class="absolute inset-x-[5%] inset-y-[20%] border-2 border-green-400 rounded pointer-events-none"></div>
    </div>
  </div>
  <div class="p-4 space-y-2">
    <p id="scanHint" class="text-center text-gray-300 text-xs"></p>
    <button id="scanBtn" onclick="tryScan(false)" class="w-full bg-green-600 text-white p-3 rounded-lg font-semibold">Scan</button>
  </div>
</div>

<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg text-white text-sm shadow-lg z-[60]"></div>

<script>
// ====== GANTI dengan URL Web App Apps Script Anda (yang berakhiran /exec) ======
const API_URL = 'https://script.google.com/macros/s/AKfycbynqfYzNe2J_oeLq2M9IAzjm6IPsZt5Ff84clIzkunXNN8WtT81fPBO3ApJEus3n1aK1Q/exec';

// Pengganti google.script.run supaya bisa jalan dari GitHub Pages
const google = { script: { get run() { return makeRunner(); } } };
function makeRunner(ok = () => {}, fail = () => {}) {
  return new Proxy({}, { get: (_, name) => {
    if (name === 'withSuccessHandler') return f => makeRunner(f, fail);
    if (name === 'withFailureHandler') return f => makeRunner(ok, f);
    return (...args) => {
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: name, args }) })   // text/plain: tanpa preflight CORS
        .then(r => r.text())
        .then(t => { try { return JSON.parse(t); } catch (e) { throw new Error('SERVER: balasan bukan data. Pastikan deployment: Execute as Me, akses Anyone, URL /exec benar, dan sudah New version.'); } })
        .then(d => d.error ? fail(new Error(d.error)) : ok(d.data))
        .catch(e => fail(new Error(e.message.startsWith('SERVER') ? e.message.slice(8) : 'Gagal terhubung ke server: ' + e.message)));
    };
  } });
}

// Status server di halaman login
(function () {
  const el = document.getElementById('srv');
  const set = (t, c) => { el.textContent = t; el.className = 'text-xs text-center ' + c; };
  if (API_URL.indexOf('script.google.com') < 0) return set('⚠ API_URL di index.html belum diisi URL /exec', 'text-red-600');
  fetch(API_URL).then(r => r.text()).then(t => { const j = JSON.parse(t); set('● Server terhubung ' + (j.versi ? '(kode v' + j.versi + ')' : '(kode LAMA: deploy ulang dengan New version)'), j.versi ? 'text-green-600' : 'text-amber-600'); })
    .catch(() => set('⚠ Server tidak terhubung. Cek URL /exec dan deployment (akses: Anyone).', 'text-red-600'));
})();

const $ = id => document.getElementById(id);
let U = "", P = "", role = "", count = 0;
const run = () => google.script.run.withFailureHandler(err => toast(err.message || err, false, 9000));

function toast(msg, ok = true, ms = 2500) {
  const t = $('toast'); t.textContent = msg;
  t.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg text-white text-sm shadow-lg z-[60] ' + (ok ? 'bg-green-600' : 'bg-red-600');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.add('hidden'), ms);
}
function beep() {
  try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator();
    o.frequency.value = 1000; o.connect(c.destination); o.start(); setTimeout(() => { o.stop(); c.close(); }, 120); } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(80);
}
const store = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const load = k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } };

/* login */
function handleLogin() {
  const btn = $('loginBtn'); btn.disabled = true; btn.textContent = 'Memeriksa...';
  const u = $('username').value, p = $('password').value;
  google.script.run
    .withSuccessHandler(res => {
      btn.disabled = false; btn.textContent = 'Masuk';
      if (!res.success) { $('loginMsg').textContent = res.message; return; }
      U = u; P = p; role = res.role;
      $('loginSection').classList.add('hidden'); $('appSection').classList.remove('hidden');
      $('loggedUser').textContent = res.user;
      if (role === 'admin') $('adminBtn').classList.remove('hidden');
      loadMaster(true);
    })
    .withFailureHandler(err => { btn.disabled = false; btn.textContent = 'Masuk'; $('loginMsg').textContent = 'Error: ' + (err.message || err); })
    .verifyLogin(u, p);
}
['username', 'password'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); }));

/* pendaftaran */
function showRegister(s) { $('registerSection').classList.toggle('hidden', !s); $('loginSection').classList.toggle('hidden', s); }
function regMsg(m, ok) { $('regMsg').textContent = m; $('regMsg').className = 'text-sm ' + (ok ? 'text-green-700' : 'text-red-600'); }
function kirimPermintaan() {
  const d = { nik: $('regNik').value.trim(), nama: $('regNama').value.trim(), keterangan: $('regKet').value.trim() };
  if (!/^\d{16}$/.test(d.nik)) return regMsg('NIK harus 16 digit angka.', false);
  if (!d.nama || !d.keterangan) return regMsg('Nama dan keterangan wajib diisi.', false);
  const btn = $('regBtn'); btn.disabled = true; btn.textContent = 'Mengirim...';
  const reset = () => { btn.disabled = false; btn.textContent = 'Kirim Permintaan'; };
  google.script.run
    .withSuccessHandler(r => { reset(); regMsg(r.message, r.success); if (r.success) ['regNik', 'regNama', 'regKet'].forEach(i => $(i).value = ''); })
    .withFailureHandler(err => { reset(); regMsg('Gagal mengirim: ' + (err.message || err), false); })
    .kirimPermintaan(d);
}

/* data master & sinkron plat <-> jenis kendaraan */
let M = { kurir: [], kendaraan: [] };
const key = s => String(s || '').toUpperCase().replace(/\s+/g, '');
const findPlat = v => v.trim() ? M.kendaraan.find(x => key(x.plat) === key(v)) : null;

function setOptions(id, items, keep) {
  const s = $(id); s.length = 1; items.forEach(v => s.add(new Option(v, v)));
  if (keep && items.includes(keep)) s.value = keep;
}
function loadMaster(init) {
  run().withSuccessHandler(d => {
    M = d; renderMaster();
    if (init) { $('shift').value = load('shift'); $('plat').value = load('plat'); onPlatInput(); $('barcode').focus(); }
  }).getMasterData(U, P);
}
function renderMaster() {
  const jenis = [...new Set(M.kendaraan.map(k => k.jenis))];
  setOptions('kurir', M.kurir, $('kurir').value || load('kurir'));
  setOptions('jenisKendaraan', jenis, $('jenisKendaraan').value);
  $('jenisList').innerHTML = jenis.map(j => '<option value="' + j.replace(/"/g, '&quot;') + '">').join('');
  refreshPlatList(); onPlatInput(); renderAdminMaster();
  if (!M.kurir.length || !M.kendaraan.length) toast('Data kurir/kendaraan belum diisi. Hubungi admin.', false, 8000);
}
function refreshPlatList() {
  const j = $('jenisKendaraan').value, dl = $('platList'); dl.innerHTML = '';
  M.kendaraan.filter(x => !j || x.jenis === j).forEach(x => { const o = document.createElement('option'); o.value = x.plat; dl.appendChild(o); });
}
function onPlatInput() {                       // ketik plat -> jenis terpilih; plat tak terdaftar -> jenis kosong
  const m = findPlat($('plat').value), j = m ? m.jenis : '';
  if ($('jenisKendaraan').value !== j) { $('jenisKendaraan').value = j; refreshPlatList(); }
  syncStatus();
}
function syncStatus() {
  const v = $('plat').value.trim(), j = $('jenisKendaraan').value, el = $('platStatus'), m = findPlat(v);
  let t = '', c = 'text-gray-500';
  if (v && m) { t = '✔ Plat terdaftar: ' + m.jenis; c = 'text-green-600'; }
  else if (v) { t = '⚠ Plat tidak terdaftar. Hubungi admin untuk menambahkannya.'; c = 'text-red-600'; }
  else if (j) t = 'Ada ' + M.kendaraan.filter(x => x.jenis === j).length + ' kendaraan ' + j + '. Pilih plat dari saran.';
  el.textContent = t; el.className = 'text-xs ' + c;
}
$('plat').addEventListener('input', onPlatInput);
$('plat').addEventListener('change', () => { const m = findPlat($('plat').value); if (m) $('plat').value = m.plat; });
$('jenisKendaraan').addEventListener('change', () => {   // pilih jenis -> plat terisi (jika hanya satu)
  const j = $('jenisKendaraan').value, list = M.kendaraan.filter(x => x.jenis === j), cur = findPlat($('plat').value);
  refreshPlatList();
  if (j && !(cur && cur.jenis === j)) $('plat').value = list.length === 1 ? list[0].plat : '';
  syncStatus();
  if (j && list.length > 1) $('plat').focus();
});

/* kelola data (main user) */
function toggleAdmin() {
  const open = $('adminPanel').classList.contains('hidden');
  $('adminPanel').classList.toggle('hidden', !open); $('logForm').classList.toggle('hidden', open);
  $('adminBtn').textContent = open ? 'Kembali ke Form' : 'Kelola Data';
  if (open) { showTab('user'); loadUsers(); }
}
function showTab(t) {
  ['user', 'kurir', 'kend'].forEach(x => {
    $('tab_' + x).classList.toggle('hidden', x !== t);
    $('tb_' + x).className = 'flex-1 py-2 text-sm rounded ' + (x === t ? 'bg-purple-600 text-white' : 'bg-gray-100 text-gray-700');
  });
}
function renderList(id, items, text, del) {
  const box = $(id); box.innerHTML = '';
  if (!items.length) { box.textContent = 'Belum ada data.'; box.className = 'text-sm text-gray-500'; return; }
  box.className = 'space-y-2';
  items.forEach(it => {
    const row = document.createElement('div'); row.className = 'flex items-center justify-between border rounded-lg p-2 text-sm';
    const info = document.createElement('div'); info.textContent = text(it); row.appendChild(info);
    if (del && !it.locked) {
      const b = document.createElement('button'); b.textContent = 'Hapus'; b.className = 'text-red-600 text-xs underline';
      b.onclick = () => del(it); row.appendChild(b);
    }
    box.appendChild(row);
  });
}
function act(fn, args, after) {
  run().withSuccessHandler(r => { toast(r.message, r.success); if (r.success) { if (after) after(); fn.indexOf('User') >= 0 || fn === 'adminAdd' || fn === 'adminDelete' ? loadUsers() : loadMaster(); } })[fn](U, P, ...args);
}
function loadUsers() {
  run().withSuccessHandler(list => renderList('userList', list.map(u => ({ ...u, locked: u.role === 'admin' })),
    u => u.username + (u.nama ? ' - ' + u.nama : '') + (u.role === 'admin' ? ' (main)' : ''),
    u => confirm('Hapus user "' + u.username + '"?') && act('adminDelete', [u.username])
  )).adminList(U, P);
}
function tambahUserBaru() {
  act('adminAdd', [{ username: $('aUser').value, password: $('aPass').value, nama: $('aNama').value }], () => ['aUser', 'aPass', 'aNama'].forEach(i => $(i).value = ''));
}
function tambahKurir() { act('adminAddKurir', [$('kNama').value], () => $('kNama').value = ''); }
function tambahKendaraan() { act('adminAddKendaraan', [$('vPlat').value, $('vJenis').value], () => { $('vPlat').value = ''; }); }
function renderAdminMaster() {
  renderList('kurirList', M.kurir.map(n => ({ n })), x => x.n, x => confirm('Hapus kurir "' + x.n + '"?') && act('adminDeleteKurir', [x.n]));
  renderList('kendList', M.kendaraan, x => x.plat + ' - ' + x.jenis, x => confirm('Hapus kendaraan ' + x.plat + '?') && act('adminDeleteKendaraan', [x.plat]));
}

/* scanner kamera: otomatis (BarcodeDetector bawaan browser) atau tekan tombol Scan */
const NATIVE = 'BarcodeDetector' in window;
let detector = null, stream = null, loopTimer = null, busy = false, torchOn = false;
const cv = document.createElement('canvas'), ctx = cv.getContext('2d', { willReadFrequently: true });

function loadLib() {
  return window.Html5Qrcode ? Promise.resolve() : new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
    s.onload = ok; s.onerror = () => no(new Error('Gagal memuat pemindai.'));
    document.head.appendChild(s);
  });
}
async function getDetector() {
  if (!NATIVE) return null;
  if (detector) return detector;
  try {
    const want = ['qr_code', 'code_128', 'code_39', 'ean_13', 'ean_8', 'upc_a', 'upc_e', 'itf', 'codabar', 'data_matrix'];
    const sup = await BarcodeDetector.getSupportedFormats();
    detector = new BarcodeDetector({ formats: want.filter(f => sup.includes(f)) });
  } catch (e) { detector = null; }
  return detector;
}
async function decodeCanvas(c) {
  const d = await getDetector();
  if (d) { const r = await d.detect(c); return r.length ? r[0].rawValue : null; }
  await loadLib();
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
  const h = new Html5Qrcode('reader', { verbose: false });
  try { return await h.scanFile(new File([blob], 'f.jpg', { type: 'image/jpeg' }), false); }
  catch (e) { return null; }
  finally { try { h.clear(); } catch (e) {} }
}
function grab() {                       // potong area tengah + kecilkan agar ringan
  const v = $('cam'), vw = v.videoWidth, vh = v.videoHeight;
  if (!vw) return null;
  const cw = vw * 0.9, ch = vh * 0.6, scale = Math.min(1, 800 / cw);
  cv.width = Math.round(cw * scale); cv.height = Math.round(ch * scale);
  ctx.drawImage(v, (vw - cw) / 2, (vh - ch) / 2, cw, ch, 0, 0, cv.width, cv.height);
  return cv;
}

async function openScanner() {
  if (stream) return;
  $('scanOverlay').classList.remove('hidden');
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    const v = $('cam'); v.srcObject = stream; await v.play();
  } catch (err) {
    closeScanner();
    return toast(/Permission|NotAllowed/i.test(String(err)) ? 'Izin kamera ditolak. Aktifkan izin kamera di browser.' : 'Kamera tidak bisa dibuka. Pakai "Scan dari foto" atau ketik manual.', false);
  }
  const tr = stream.getVideoTracks()[0], caps = tr.getCapabilities ? tr.getCapabilities() : {};
  if (caps.torch) $('torchBtn').classList.remove('hidden');
  tr.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
  if (await getDetector()) { $('scanHint').textContent = 'Otomatis: arahkan ke barcode/QR di dalam kotak hijau.'; loop(); }
  else $('scanHint').textContent = 'Arahkan barcode/QR ke kotak hijau, lalu tekan Scan.';
}
function loop() {                        // ±5x per detik, ringan
  clearTimeout(loopTimer);
  loopTimer = setTimeout(async () => { if (!stream) return; await tryScan(true); loop(); }, 200);
}
async function tryScan(silent) {
  if (busy || !stream) return;
  busy = true; $('scanBtn').disabled = true;
  try {
    const c = grab();
    const text = c && await decodeCanvas(c);
    if (text) onScanned(text);
    else if (!silent) toast('Belum terbaca, dekatkan & pastikan terang, lalu coba lagi.', false);
  } catch (e) { if (!silent) toast(e.message || 'Gagal membaca.', false); }
  finally { busy = false; $('scanBtn').disabled = false; }
}
function onScanned(text) {
  beep(); $('barcode').value = text.trim(); closeScanner();
  if ($('autoSave').checked && $('logForm').checkValidity()) $('logForm').requestSubmit();
}
function closeScanner() {
  clearTimeout(loopTimer);
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('cam').srcObject = null; torchOn = false;
  $('torchBtn').classList.add('hidden'); $('scanOverlay').classList.add('hidden');
}
async function toggleTorch() {
  try { torchOn = !torchOn; await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: torchOn }] }); }
  catch (e) { torchOn = false; }
}
$('fileScan').addEventListener('change', async e => {     // cadangan: scan dari foto
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const bmp = await createImageBitmap(f), s = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
    cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
    ctx.drawImage(bmp, 0, 0, cv.width, cv.height);
    const t = await decodeCanvas(cv);
    t ? onScanned(t) : toast('Barcode tidak terbaca, coba foto lebih dekat/terang.', false);
  } catch (err) { toast('Gagal membaca foto.', false); }
});

/* simpan */
function handleSubmit(e, force) {
  e.preventDefault();
  const m = findPlat($('plat').value);
  if (!m) return toast('Plat tidak terdaftar. Hubungi admin untuk menambahkannya.', false, 5000);
  const btn = $('submitBtn'); btn.disabled = true; btn.textContent = 'Menyimpan...';
  const d = { barcode: $('barcode').value.trim(), shift: $('shift').value, kurir: $('kurir').value, plat: m.plat, jenisKendaraan: m.jenis };
  const done = () => { btn.disabled = false; btn.textContent = 'Simpan Data'; };
  google.script.run
    .withSuccessHandler(r => {
      done();
      if (r.duplicate) { if (confirm(r.message)) handleSubmit(e, true); else $('barcode').select(); return; }
      if (!r.success) return toast(r.message, false, 5000);
      toast(r.message); $('counter').textContent = (++count) + ' scan';
      store('shift', d.shift); store('kurir', d.kurir); store('plat', d.plat);
      $('barcode').value = ''; $('barcode').focus();
    })
    .withFailureHandler(err => { done(); toast(err.message || err, false, 5000); })
    .saveData(U, P, d, !!force);
}
</script>
